# RFI YAML Template
# This template is structured to capture all information needed to generate a complete Request for Information (RFI) document.
# Fill in the placeholders (denoted by []) with specific information for your RFI.

header:
  title: "[Clear, concise title of the RFI]"
  agency_department: "[Name of Agency/Department]"
  rfi_issue_date: "[Date]"
  document_type: "Request for Information (RFI)"
  disclaimer: "Please note that this Request for Information (RFI) is for informational purposes only, and no contract will be awarded as a result. A firm or organization's response to the RFI—or lack thereof—will have no impact on the evaluation of responses to any subsequent Request for Proposals (RFP) or Invitation to Bid (ITB) released. Responses will be used solely for information and planning purposes."
  public_record_notice: "Please note that all responses will be public record. Do not submit confidential information in your response." # Optional, include if applicable

section_1:
  rfi_overview:
    summary: |
      [One paragraph high-level description of the RFI purpose. Example: "In 2023, Citylandia plans to purchase a new Fire Records Management software that will contain modules that support personnel management and scheduling. The City may want to select a solution that can be deployed modularly (e.g., tracking incidents, properties, and inspections in Phase 1; and personnel management and scheduling in Phase 2). We are seeking information about what solutions currently exist in the market and are interested in learning about what information you would need to scope a logical road map for this deployment."]
  rfi_contact:
    point_of_contact:
      name: "[Name]"
      title: "[Title]"
      department_agency: "[Department/Agency Affiliation]"
      email: "[Email]"
      phone: "[Phone number]"
    instructions: "We have designated the following individual to serve as the official point of contact for this RFI. This individual is the only authorized contact permitted to communicate on behalf of the [Name of Agency/Department] about this RFI."
  submission_details:
    method: "[email to the RFI point of contact/e-procurement portal]" # Specify submission method
    requirements: "[Insert any requirements for submission, such as file size, email subject lines, number of attachments, etc.]"
    physical_copies: "[Also Allowed/Not Allowed/Optional]" # Choose one
    physical_address: "[If allowed/optional: Delivery address]"
    instructions: "Please submit your responses to this RFI via [method] before the due date identified in Section 1.3. When submitting your response, please [requirements]. If you have any questions about this RFI, please direct them to the RFI contact."
  rfi_timeline:
    events:
      - event: "RFI Released"
        date: "[Insert Date]"
      - event: "RFI Conference"
        date: "[Not Applicable or Insert Date]"
      - event: "Deadline for Questions"
        date: "[Insert Date]"
      - event: "Responses Due"
        date: "[Insert Date]"
    amendment_note: "Dates may be modified or amended by the [Name of Agency/Department], which will post an amendment to this RFI notifying prospective respondents of any change."
  rfi_conference:
    will_be_held: "[Yes/No]" # Choose one
    details:
      optional: true
      purpose: "to answer questions from prospective respondents"
      activities: "During the Information Session, [Name of Agency/Department] staff will summarize the goals of the RFI, and the information requested. [Name of Agency/Department] staff will take questions from prospective respondents and community members during the Information Session."
      recording: "A recording of the RFI Information Session will be posted to [Insert Website]."
      q_a_note: "Any answers given at the Information Session are tentative, and final answers will be provided via a Q&A document released after the Deadline for Questions identified in Section 1.3."

section_2:
  background_information:
    mission_history: |
      [Include only if relevant. Boilerplate language about your agency's mission and history that provides useful context for respondents.]
  goals_and_outcome:
    description: |
      [Describe the goals for the services and programs you hope will be impacted by responses to the RFI. Mention if a future RFP is anticipated. Example: "With a combined capital budget of nearly $120 million for fiscal year 2021, the City of Citylandia's Public Facilities, Public Works, Parks and Recreation, and Transportation Departments complete dozens of designs and projects each year. This diverse portfolio ranges from energy efficiency projects at City Hall to a 'Safe Routes to Schools' initiative to ongoing investment in courts and playgrounds across the city. Currently, projects are managed through a combination of home-grown databases, paper files, and Excel spreadsheets. Citylandia seeks a software solution to improve these processes; increase the availability and transparency of data; and promote efficient management of programs, projects, budgets, schedules, and partnerships."]
  background:
    context: |
      [Briefly describe the history of what led to the project being started and the RFI being issued, including any relevant contextual information such as legislation, strategic plans, or current technology environment.]

section_3:
  who_we_are_looking_for:
    description: |
      [Briefly describe who you'd be especially interested in having respond to the RFI. Include both basic features and expected capacities.]
    suggested_language: "The [Name of Agency/Department] is especially interested in hearing feedback on this proposed project from the following firms, organizations, or individuals: [Community Organizations/Subject Matter Experts/Vendors/Service Users/Professional Associations/etc.]"
  what_we_are_looking_for:
    instructions: |
      [Describe what information you hope to receive. Consider breaking into categories or listing specific questions.]
    suggested_language: "Respondents are invited to provide information on the following subjects of interest to the [Name of Agency/Department]: [Feedback on Planned Approach/ Information about Y Technology Marketplace/How Project will Impact X Community/etc.] Information provided should total no more than [Insert Number] total pages. Respondents [May/May Not] include additional attachments with their response document."
    question_categories: # Optional: Structure questions into categories
      - category: "[Category Name 1]"
        questions:
          - "[Question 1]"
          - "[Question 2]"
      - category: "[Category Name 2]"
        questions:
          - "[Question 1]"
    example_types: # For reference, not to be filled
      - type: "Example 1: Seeking information from organizations about supportive housing"
      - type: "Example 2: Specific questions to inform future IT RFP design"
      - type: "Example 3: Content from an RFP Scope of Work for feedback"

appendix:
  included: "[Yes/No]" # Choose one
  materials: |
    [List or describe any additional background information, context, legislative language, implementation timelines, survey data, budget information, process maps, procedures, or data summaries to be included.]

usage_notes:
  - "Review the entire template before populating to avoid redundancy."
  - "Customize all placeholder text specific to your government."
  - "Work with contracting and legal teams to ensure compliance with your government's requirements."
  - "Make many questions optional to allow respondents to focus on their expertise."