# RFB YAML Template
# This template is structured to capture all information needed to generate a complete Request for Bid (RFB) document.
# Fill in the placeholders (denoted by []) with specific information for your RFB.

metadata:
  document_type: "Request for Bid (RFB)"
  purpose: "For competitive bidding on commodities or services where lowest responsive bid typically wins."
  usage_notes:
    - "Use for procurement where requirements are clearly defined and price is primary factor."
    - "Typically used for commodities and standardized services."
    - "Mandatory requirements must be met without exception."
    - "Lowest responsive, responsible bidder typically wins."

header:
  title: "[TITLE]"
  number: "[NUMBER]"
  issued_date: "[DATE]"
  responses_due: "[DATE/TIME]"
  agency_logo: "INSERT AGENCY LOGO"
  agency_name: "[AGENCY NAME]"

section_1_introduction:
  definitions:
    agency: "An office, department, agency, institution of higher education, association, society or other body in state government created or authorized to be created by the constitution or any law, which is entitled to expend moneys appropriated by law, including the legislature and the courts, but not including an authority."
    authorized_users: "Includes any state agency, university campus, or other state or local public body authorized to use contracts."
    bid: "A price quotation specifically given to a prospective purchaser by a prospective seller; a bid is an offer to sell."
    bidder: "A person or firm that responds to this Request for Bid."
    commodity: "A tangible article of trade or item of merchandise; goods, products, materials, supplies, or finished products."
    contract: "The written agreement between the successful bidder and the state covering the commodities and services to be performed."
    contract_administrator: "The agency employee responsible for oversight of the implementation, administration, and completion of the contract."
    contractor: "The person or entity that has been awarded the contract."
    disabled_veteran_owned_business: "A business that has been certified by the Department of Administration."
    minority_owned_business_enterprise: "A business that has been certified by the Department of Administration."
    municipality: "Any Wisconsin county, city, village, town, school district, or other public body having authority to award public contracts."
    notice_of_intent_to_award: "A writing issued by the procuring agency notifying all bidders of intent to award."
    purchasing_card: "A charge card issued to authorized state employees."
    procurement_specialist: "The individual responsible for overseeing and administering the procurement process."
    procuring_agency: "The state agency conducting the purchasing transactions."
    services: "An intangible product, including actions, recommendations, plans, research, customizations, modifications, documentation, and maintenance."
    specification: "A descriptive statement of the physical, functional and performance characteristics required."
  purpose_and_scope:
    description: "The [PROCURING AGENCY NAME] requests bids for the purchase of [COMMODITY/SERVICE], and intends to use the results of this process to award a contract."
    guarantees: "No guarantee to purchase any specific quantity or dollar amount. Bids requiring minimum orders will be rejected."
  overview:
    placeholder: "[PLACEHOLDER - Overview of procuring agency, background, and objectives]"
  contract_term:
    initial_term: "[TERM] years"
    renewal_options: "[NUMBER] additional [RENEWAL]-year periods"
    effective_date: "Date of execution or purchase order date if no formal contract"
    contract_documents: "RFB documents, awarded bidder's response, and purchase order become the contract"
  contract_modifications:
    restriction: "Contract shall not be used for purchases outside original scope."
    requirements: "Modifications must be in writing and signed by both parties."
  order_of_precedence:
    with_formal_contract:
      - "Final Signed Contract with clarifications"
      - "Bid Response as accepted by the State"
      - "Request for Bid"
    with_purchase_order:
      - "Official Purchase Order"
      - "Bid Response as accepted by the State"
      - "Request for Bid"
  cooperative_purchasing:
    available_to_municipalities: "[Yes/No]"
    requirements: "Contractor must confirm municipality status, provide documentation, and report usage."
  responding_to_bid_requirements:
    mandatory_requirements: "Must be minimally met without exception."
    qualification_documentation: "Bidder must submit appropriate supporting documentation."
    itemized_requirements: "Bidder must affirmatively respond to all requirements."
    disqualification: "Failure to meet mandatory requirements disqualifies bid."
    state_discretion: "State may select closest bid if no bidder meets all requirements."

section_2_bidder_qualifications:
  note: "All bidder qualifications in this section are mandatory and shall be met at no additional cost above the pricing provided in the bid."
  # Specific qualifications to be defined per RFB

section_3_mandatory_specifications:
  note: "All requirements in this section are mandatory and shall be met at no additional cost above the pricing provided in the bid."
  technical_requirements:
    response_format: "[INSERT TITLE OF ATTACHMENT OR OTHER INSTRUCTION]"
  performance_and_support_requirements:
    response_format: "[INSERT TITLE OF ATTACHMENT OR OTHER INSTRUCTION]"

