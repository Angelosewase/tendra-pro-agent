  return_policy:
    placeholder: "[PLACEHOLDER - Return policy for defective or damaged goods]"
  new_and_discontinued_items:
    placeholder: "[PLACEHOLDER - Policy for new and discontinued items]"
  random_product_sampling:
    placeholder: "[PLACEHOLDER - Random product sampling requirements]"
  acceptance_testing:
    placeholder: "[PLACEHOLDER - Acceptance testing requirements]"
  background_checks:
