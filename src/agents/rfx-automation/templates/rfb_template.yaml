      requirement: "Upon request, provide copies of insurance policies/certificates."
      company_rating: "Minimum AM Best rating of A- unless otherwise approved."
      notification: "Immediate notice required for modifications or cancellations."
    option_2_service:
      timeframe: "[NUMBER] days from Notice of Intent to Award"
      extension: "[NUMBER] additional days to comply"
      consequence: "Failure may result in cancellation of award."
      delivery_address:
        agency: "[Agency Name]"
        contact: "[Agency Division, Bureau Program Manager Name, Title Agency Address]"
        address: "[Agency Address]"
        city_state_zip: "[City, State and Zip Code]"
  high_risk_certificates:
    placeholder: "[PLACEHOLDER - High risk insurance coverage requirements]"
  access_to_secure_facilities:
    placeholder: "[PLACEHOLDER - Access to secure facilities requirements]"
  cancellation_and_termination:
